name: Sync upstream

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync upstream (exclude workflows)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream
          git checkout main
          # 合并上游，但合并后立即把 workflows 目录恢复成你本地的版本
          git merge upstream/main --allow-unrelated-histories -m "Sync with upstream" || true
          git checkout HEAD -- .github/workflows 2>/dev/null || true
          git add -A
          git commit -m "Sync with upstream (workflows kept local)" --allow-empty
          git push origin main
